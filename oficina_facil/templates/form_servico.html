{% extends "base.html" %}
{% block title %}Novo serviço | Oficina Fácil{% endblock %}
{% block content %}<section class="panel narrow"><a class="back" href="{{ url_for('servicos') }}">← Voltar</a><h1>Novo serviço</h1>
<form method="post" class="form"><label>Nome<input name="nome" required></label><label>Descrição<textarea name="descricao" rows="3"></textarea></label><label>Preço (R$)<input name="preco" type="number" min="0" step="0.01" required></label><button class="button">Salvar serviço</button></form></section>{% endblock %}
